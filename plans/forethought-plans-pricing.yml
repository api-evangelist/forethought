      - name: Performance dashboards
      - name: Customizable QA framework
  - id: forethought-for-slack-addon
    name: Forethought for Slack (Add-On)
    type: addon
    description: Internal knowledge access via Slack.
    entries:
      - label: Contact Sales for pricing
